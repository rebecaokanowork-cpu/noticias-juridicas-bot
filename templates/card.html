<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    position: relative;
    background: #111;
  }

  /* ── Imagem de fundo ─────────────────── */
  .bg {
    position: absolute;
    inset: 0;
    background-image: url('{{IMAGEM}}');
    background-size: cover;
    background-position: center top;
    background-color: #1a1a2e;
  }

  /* ── Gradientes sobrepostos ──────────── */
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,.55) 0%,
      rgba(0,0,0,.05) 28%,
      rgba(0,0,0,.0)  45%,
      rgba(0,0,0,.55) 65%,
      rgba(0,0,0,.93) 100%
    );
  }

  /* ── Conteúdo ────────────────────────── */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px 68px 60px;
  }

  /* ── Logo ────────────────────────────── */
  .logo {
    display: flex;
    align-items: center;
  }

  .logo-text {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #fff;
  }

  .logo-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #E8C77A;
    margin-left: 5px;
    vertical-align: middle;
    margin-bottom: 2px;
  }

  /* ── Bloco inferior ──────────────────── */
  .bottom {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .categoria {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: #E8C77A;
    align-self: flex-start;
    padding-bottom: 5px;
    border-bottom: 2px solid #E8C77A;
  }

  .titulo {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 900;
    font-size: 60px;
    line-height: 1.08;
    color: #fff;
    text-shadow: 0 2px 24px rgba(0,0,0,.4);
    /* Clamp a 5 linhas */
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .rodape {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,.18);
  }

  .fonte {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: rgba(255,255,255,.5);
  }

  .data {
    font-size: 12px;
    color: rgba(255,255,255,.35);
    letter-spacing: .05em;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="logo">
      <span class="logo-text">Notícia Jurídica<span class="logo-dot"></span></span>
    </div>

    <div class="bottom">
      <span class="categoria">{{CATEGORIA}}</span>
      <h1 class="titulo">{{TITULO}}</h1>
      <div class="rodape">
        <span class="fonte">{{FONTE}}</span>
        <span class="data">{{DATA}}</span>
      </div>
    </div>
  </div>
</body>
</html>
