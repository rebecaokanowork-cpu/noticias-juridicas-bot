name: Post Instagram

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 BRT (manhã)
    - cron: '0 16 * * *'   # 13:00 BRT (tarde)
    - cron: '0 21 * * *'   # 18:00 BRT (noite)
  workflow_dispatch:        # disparo manual pelo GitHub

permissions:
  contents: write           # para commitar o posted.json atualizado

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('instagram-bot/package.json') }}

      - name: Install dependencies
        run: npm install
        working-directory: instagram-bot

      - name: Run bot
        run: node scripts/post.js
        working-directory: instagram-bot
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          POSTS_PER_RUN: '4'
          NOTICIAS_URL: 'https://noticiajuridicas.com.br/noticias.json'

      - name: Commit tracker atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram-bot/data/posted.json
          git diff --staged --quiet || git commit -m "chore: update posted articles [skip ci]"
          git push
